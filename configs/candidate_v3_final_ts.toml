# candidate_v3_final_ts.toml — v3 Final with Three-State classifier
# Adds three-state market classifier with aggressive (high) exposure thresholds.
# Strong=1.00, Neutral=0.80, Weak=0.50 — more participation than binary (1.00/0.00).
# Breadth data excluded (starts later than main data); three_state handles None gracefully.

[data]
industry_close = "../data/real_sw2021/industry_close.csv"
industry_amount = "../data/real_sw2021/industry_amount.csv"
benchmark_close = "../data/real_sw2021/benchmark_close.csv"
market_close = "../data/real_sw2021/market_close.csv"

[strategy]
rebalance_every = 20
top_k = 5
max_industry_weight = 0.30
transaction_cost = 0.001
risk_control = true
market_state_mode = "three_state"
three_state_strong_exposure = 1.00
three_state_neutral_exposure = 0.80
three_state_weak_exposure = 0.50
three_state_trend_weight = 0.35
three_state_dispersion_weight = 0.25
three_state_momentum_weight = 0.25
three_state_breadth_weight = 0.15
three_state_strong_threshold = 0.15
three_state_weak_threshold = -0.15
portfolio_mode = "equal"
cluster_constraint = true
max_per_cluster = 2
dynamic_top_k = true
dynamic_top_k_min = 3
dynamic_top_k_max = 7
dynamic_top_k_disp_low = 0.04
dynamic_top_k_disp_high = 0.10

[factors]
ret60_weight = 1.00
ret5_weight = -0.50
ret20_weight = 0.00
ret120_weight = 0.00
consistency60_weight = 0.00
rel_ret60_weight = 0.00
rel_ret20_weight = 0.00
momentum_accel_weight = 0.00
amount_strength_weight = 0.00
breadth20_weight = 0.00
breadth60_weight = 0.00
valuation_weight = 0.00
prosperity_weight = 0.00
vol20_weight = 0.00

[reports]
output_dir = "../reports/candidate_v3_final_ts"

[market_weights]
CSI300 = 0.50
CSIAll = 0.30
ChiNext = 0.20
