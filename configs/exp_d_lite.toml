# Phase D simplified (low look-ahead bias version)
# Uses only liquidity filter (成交额前30% in selected industry) instead of complex stock scoring.
# Top 10 stocks per industry, equal-weight, no vol/momentum stock factors.
# Purpose: test whether stock layer adds value without survivor bias.

[data]
industry_close = "../data/real_sw2021/industry_close.csv"
industry_amount = "../data/real_sw2021/industry_amount.csv"
benchmark_close = "../data/real_sw2021/benchmark_close.csv"
market_close = "../data/real_sw2021/market_close.csv"
stock_close = "../data/real_sw2021/stock_close.csv"
stock_amount = "../data/real_sw2021/stock_amount.csv"
stock_industry_map = "../data/real_sw2021/stock_industry_map.csv"

[strategy]
rebalance_every = 20
top_k = 3
max_industry_weight = 0.35
transaction_cost = 0.001
risk_control = true
market_ma_window = 120
market_score_control = false
market_score_window = 60
market_score_threshold = 0.0
risk_off_exposure = 0.00
stock_selection = true
stock_top_n_per_industry = 10
stock_min_stocks_per_industry = 5
stock_max_weight = 0.05

[factors]
ret60_weight = 1.00
ret5_weight = -0.50

stock_ret60_weight = 0.00
stock_vol20_weight = 0.00
stock_ret5_weight = 0.00
stock_consistency20_weight = 0.00
stock_amount_strength_weight = 1.00

[reports]
output_dir = "../reports/exp_d_lite"

[market_weights]
CSI300 = 0.50
CSIAll = 0.30
ChiNext = 0.20
