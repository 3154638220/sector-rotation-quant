# 实验 A2-EXP1: 相对动量 (rel_ret60) 替代绝对动量
# 目的: 验证剔除 Beta 后的行业相对强度是否提升 Sharpe
# 
# 验收标准: sw2021 Sharpe >= 0.55, sw2014 OOS Sharpe 中位数 > 0.15

[data]
industry_close = "../data/real_sw2021/industry_close.csv"
industry_amount = "../data/real_sw2021/industry_amount.csv"
industry_prosperity = "../data/real_sw2021/industry_prosperity.csv"
benchmark_close = "../data/real_sw2021/benchmark_close.csv"
market_close = "../data/real_sw2021/market_close.csv"

[strategy]
rebalance_every = 20
top_k = 5
max_industry_weight = 0.30
transaction_cost = 0.001
risk_control = true
market_ma_window = 120
market_score_control = true
market_score_window = 60
market_score_threshold = 0.0
risk_off_exposure = 0.00
portfolio_mode = "equal"

[factors]
ret20_weight = 0.00
ret60_weight = 0.00
ret120_weight = 0.00
rel_ret60_weight = 1.00
rel_ret20_weight = 0.00
momentum_accel_weight = 0.00
consistency60_weight = 0.00
amount_strength_weight = 0.00
breadth20_weight = 0.00
breadth60_weight = 0.00
valuation_weight = 0.00
prosperity_weight = 0.00
vol20_weight = 0.00
ret5_weight = -0.50

[reports]
output_dir = "../reports/exp_rel_momentum"

[market_weights]
CSI300 = 0.50
CSIAll = 0.30
ChiNext = 0.20
